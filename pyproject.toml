[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    "build",
    "install",
    "log",
    "malbut_test",
    "malbut_yolo/vendor",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "W6",
    "S102",
    "S301",
    "S307",
    "S324",
    "S602",
]
ignore = [
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["E402", "S101"]
"**/*_test.py" = ["E402", "S101"]
".github/scripts/test-*.py" = ["E402", "S101"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_site_packages = true
explicit_package_bases = true
mypy_path = "malbut_agent_server:homecam_agent/homecam_detector:malbut_autoslam"
show_error_codes = true
pretty = false
