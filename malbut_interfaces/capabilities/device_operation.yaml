    request_id:
      type: string
      description: 중복 실행을 방지하는 작업 식별자
    operation:
      type: string
      description: 등록된 기기 작업 이름
    arguments_json:
      type: string
      description: 해당 작업의 고정 입력을 담은 JSON 객체

execution:
  mode: BACKGROUND
  priority: NORMAL
  resources: []
