schema_version: 1

capability:
  id: compute_path_to_pose
  title: 경로 미리보기
  description: Nav2를 사용해 현재 위치에서 목적지까지의 경로만 계산한다. 로봇은 이동하지 않는다.

command:
  kind: ACTION
  name: /compute_path_to_pose
  type: nav2_msgs/action/ComputePathToPose

input:
  fields:
    goal:
      type: geometry_msgs/PoseStamped
      description: 경로를 계산할 목적지
    start:
      type: geometry_msgs/PoseStamped
      description: use_start가 true일 때 사용할 출발점
      default: {}
    planner_id:
      type: string
      description: 사용할 Nav2 경로 계획기
      default: GridBased
    use_start:
      type: bool
      description: 지정한 출발점을 사용한다. false이면 현재 로봇 위치를 사용한다.
      default: false

execution:
  mode: BACKGROUND
  priority: NORMAL
  resources: []
