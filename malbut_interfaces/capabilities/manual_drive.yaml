schema_version: 1

capability:
  id: manual_drive
  title: 수동 조작
  description: 조이스틱·웹 입력을 Nav2 AssistedTeleop으로 받아 충돌을 피하며 로봇을 직접 조작한다.

command:
  kind: ACTION
  name: /assisted_teleop
  type: nav2_msgs/action/AssistedTeleop

input:
  fields:
    time_allowance:
      type: builtin_interfaces/Duration
      description: 최대 유지 시간. 0이면 제한 없이 manual_control의 무입력 해제를 따른다.
      default: {sec: 0, nanosec: 0}

execution:
  mode: FOREGROUND
  priority: HIGH
  resources: [BASE]

# 입력은 /cmd_vel_teleop(geometry_msgs/Twist)이며 조이스틱과 로봇 웹 패널이 발행한다.
# Bringup의 manual_control이 조작 입력을 받으면 이 기능을 요청하고, 5초 동안 조작이
# 없으면 /preempt_teleop으로 끝낸다. 지도 선택 여부와 무관하게 사용할 수 있다.
# HIGH라서 실행 중인 NORMAL 이동 미션을 취소하고, 수동 조작 중에는 NORMAL 이동 요청을 거부한다.
# 끝나거나 취소되면 Nav2가 로봇을 정지한다. 자동 재개하지 않는다.
