schema_version: 1
purpose: interface_contract_and_recommended_defaults

runtime_defaults:
  variant_config: ultimate_orin_nx_super_mecanum.yaml
  world: empty
  entity_name: malbut
  spawn_timeout: 60.0
  spawn:
    x: 0.0
    y: 0.0
    z: 0.002
    yaw: 0.0
  sensors:
    lidar_enabled: true
    depth_camera_enabled: true
    imu_enabled: true
  interfaces:
    cmd_vel: /cmd_vel
    odom: /odom
    tf: /tf
    joint_states: /joint_states
    scan: /scan
    imu: /imu/data
    color_image: /camera/color/image_raw
    color_camera_info: /camera/color/camera_info
    depth_image: /camera/depth/image_raw
    point_cloud: /camera/depth/points

physics:
  engine: dart
  max_step_size: 0.001
  real_time_factor: 1.0
  status: ready_for_tuning

contract:
  frame_convention: REP-103
  fixed_frames:
    - odom
    - base_footprint
    - base_link
    - laser_frame
    - imu_link
    - camera_link
    - camera_depth_optical_frame
