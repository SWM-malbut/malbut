# ROSOrin parameters maintained in Malbut, based on the robot-provided config
# (Hiwonder ROSOrin ROS2 navigation/config: nav2_params.yaml, nav2_controller_dwb.yaml).
# malbut_bringup/nav2_stack.py composes every server below with this file.
# The vendor driver clamps /cmd_vel to 0.2 m/s and 0.5 rad/s; DWB, the smoother and
# behaviors use those limits. Other DWB values are the vendor's, plus a footprint
# critic that rejects trajectories whose rectangular outline would hit an obstacle.
# Costmaps are LiDAR-only: the depth layer is not built or loaded because its depth
# input delayed TF on the robot (see depth_costmap/README.md to restore it).
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 3000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # Mecanum base: joystick and manual driving command lateral motion.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_raw
    set_initial_pose: False
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    #enable_groot_monitoring: True
    #groot_zmq_publisher_port: 1666
    #groot_zmq_server_port: 1667
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 0.25 m (vendor) stopped almost a body length short of a web goal and
      # outside the person follower's 0.90-1.10 m standoff band. AMCL jitter
      # and the 0.03 m local grid make anything below ~0.10 m hunt back and forth.
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # Driver /cmd_vel limits instead of the vendor's 0.4 m/s and 1.0 rad/s.
      min_vel_x: -0.2
      min_vel_y: 0.0
      max_vel_x: 0.2
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.2
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # DWB switches to RotateToGoal here; keep it equal to the goal checker.
      xy_goal_tolerance: 0.12
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      # BaseObstacle (vendor): the robot-centre cell rejects the 0.106 m inscribed
      # circle and its cost is the graded preference for staying clear of walls.
      # ObstacleFootprint: the padded rectangular outline, rotated along the
      # trajectory, rejects front, back and corner contact that the centre cell
      # misses. Its score stays negligible on purpose: under the outline the
      # inflated cost reads 174-253 for any body clearance up to 0.35 m, so as a
      # preference it made standing still cheaper than driving along a wall.
      # Scale 0 would skip the critic entirely.
      # PreferForward (built-in dwb_critics) adds `penalty` x `scale` to every
      # trajectory that drives backwards; strafe_x/theta_scale are zeroed so
      # forward turning and rotating in place stay free. 40 is the upper end of
      # the range public DWB configs use next to PathDist 32 / GoalDist 24: a
      # soft preference for driving forward, not a ban. Reverse still wins when
      # it saves clearly more path distance or when every forward sample is
      # rejected by the obstacle critics. The person follower backs away from a
      # too-close person with the BackUp behavior, not through this controller.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "PreferForward"]
      PreferForward.scale: 40.0
      PreferForward.penalty: 1.0
      PreferForward.strafe_x: 0.0
      PreferForward.strafe_theta: 0.2
      PreferForward.theta_scale: 0.0
      BaseObstacle.scale: 0.02
      ObstacleFootprint.scale: 0.01
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.03
      # Official ROSOrin mecanum outline: 0.277 m long, 0.212 m wide.
      footprint: "[[0.1385, 0.106], [0.1385, -0.106], [-0.1385, -0.106], [-0.1385, 0.106]]"
      # The one fixed margin around the outline (Nav2 default). DWB's footprint
      # critic, AssistedTeleop and the Collision Monitor all use the padded outline;
      # the inflation layer adds the graded preference beyond it.
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      # Saved-map Zones: zone_filter loads the mask for the selected map.
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/keepout_costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        # Keep a graded wall-clearance band beyond the 0.174 m footprint corner.
        inflation_radius: 0.30
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan_raw
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

  local_costmap_client:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      # Official ROSOrin mecanum outline: 0.277 m long, 0.212 m wide.
      footprint: "[[0.1385, 0.106], [0.1385, -0.106], [-0.1385, -0.106], [-0.1385, 0.106]]"
      # The one fixed margin around the outline (Nav2 default). DWB's footprint
      # critic, AssistedTeleop and the Collision Monitor all use the padded outline;
      # the inflation layer adds the graded preference beyond it.
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # Saved-map Zones: zone_filter loads the mask for the selected map.
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/keepout_costmap_filter_info"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_raw
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        # Prefer paths away from walls without forbidding the entire soft band.
        inflation_radius: 0.30
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    #topic_name: map
    #frame_id: map
    yaml_filename: ""

# Zone mask (raw costs: 0 allow, 70 avoid, 100 restricted) in the saved map's
# frame. zone_filter loads it through load_map; see malbut_bringup/zones.py.
zone_filter_mask_server:
  ros__parameters:
    use_sim_time: False
    frame_id: map
    topic_name: /keepout_filter_mask
    yaml_filename: ""

zone_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0  # keepout
    filter_info_topic: /keepout_costmap_filter_info
    mask_topic: /keepout_filter_mask
    base: 0.0
    multiplier: 1.0

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # An unreachable goal cell (inside a wall, furniture or a person's own
      # LiDAR blob plus the 0.106 m inscribed inflation) is moved to the nearest
      # reachable cell within this radius. The person follower plans straight to
      # the person and relies on it; a person's two legs need about 0.35 m.
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Required by the default Nav2 navigation tree and Malbut observation turns.
    behavior_plugins: [spin, wait, backup]
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    backup:
      plugin: "nav2_behaviors/BackUp"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# manual_drive: AssistedTeleop from /cmd_vel_teleop, in its own server so that only
# manual driving goes through the Collision Monitor (see nav2_stack.py).
teleop_behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [assisted_teleop]
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.0, 0.5]
    min_velocity: [-0.2, 0.0, -0.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Last check on manual driving (AssistedTeleop) before the driver's /cmd_vel.
# Navigation and Spin/BackUp publish /cmd_vel directly: DWB's footprint critic and
# the behaviors' own costmap checks avoid obstacles there. The approach model
# scales a command down so the footprint would not reach a LiDAR point within
# time_before_collision; motion away from an obstacle is unchanged. Humble ignores
# scans older than source_timeout instead of stopping: not an emergency stop.
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_pre_collision"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 1.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.0
      simulation_time_step: 0.1
      # Up to this many points inside the footprint are treated as noise.
      max_points: 3
      visualize: False
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_raw"
