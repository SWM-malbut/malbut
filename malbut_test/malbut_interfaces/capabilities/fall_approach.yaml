schema_version: 1

capability:
  id: fall_approach
  title: 낙상 의심 장소 확인하러 가기
  description: 사람인지 확실하지 않은 낙상 의심 장소 1 m 앞까지 금지 구역을 피해 가서 바라보거나, 몸 일부만 보이면 몸통이 보일 때까지 물러나거나 둘러보거나, 확인 뒤 원래 자리로 돌아간다.

command:
  kind: ACTION
  name: /malbut/falls/approach
  type: malbut_interfaces/action/FallApproach

input:
  fields:
    request_id:
      type: string
      description: Agent 낙상 규칙의 확인 요청 식별자(질문 ID)
    phase:
      type: string
      description: approach(가기), view(몸통이 보일 때까지 옮기기), return(돌아가기) 또는 hold(확인 중 바퀴만 붙잡기)
    x:
      type: float64
      description: 의심 장소의 지도 x 좌표(m)
      default: 0.0
    y:
      type: float64
      description: 의심 장소의 지도 y 좌표(m)
      default: 0.0
    standoff_m:
      type: float64
      description: 의심 장소 앞에서 멈출 거리(m)
      default: 1.0
    reason:
      type: string
      description: 돌아가는 이유(return만) — not_a_person, off_floor 또는 revisit(기다린 뒤 다시 가서 보고 알림만 보냄)
      default: ""

# HIGH: 순찰(LOW)·목적지 이동 등은 끊고 확인하러 가지만, 직접 움직이기(URGENT)는
# 끊지 않는다. 막히면 Agent 낙상 규칙이 기다렸다가 다시 신청한다.
execution:
  mode: FOREGROUND
  priority: HIGH
  resources: [BASE]
