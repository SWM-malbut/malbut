schema_version: 1
capability:
  id: fall_confirmation
  title: 낙상 상황 확인
  description: 주행과 음성 자원을 확보하고 대화로 낙상 여부와 도움 필요 여부를 확인한다.
command:
  kind: ACTION
  name: /malbut/agent/confirm_situation
  type: malbut_interfaces/action/ConfirmSituation
input:
  fields:
    request_id:
      type: string
      description: 낙상 코디네이터가 부여한 확인 요청 식별자
    situation_type:
      type: string
      description: 확인할 상황 종류
    summary:
      type: string
      description: 확인 대화에 전달할 상황 요약
execution:
  mode: FOREGROUND
  priority: URGENT
  resources: [BASE, SPEAKER]
