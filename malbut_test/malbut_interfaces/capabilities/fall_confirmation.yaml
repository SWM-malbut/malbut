schema_version: 1
capability:
  id: fall_confirmation
  title: 낙상 상황 확인
  description: 주행과 음성 자원을 확보하고 대화로 낙상 여부와 도움 필요 여부를 확인한다.
command:
  kind: ACTION
  name: /malbut/agent/confirm_situation
  type: malbut_interfaces/action/ConfirmSituation
input:
  fields:
    request_id:
      type: string
      description: Agent 낙상 규칙이 부여한 확인 요청 식별자
    situation_type:
      type: string
      description: 확인할 상황 종류
    summary:
      type: string
      description: 확인 대화에 전달할 상황 요약
# NORMAL(2026-10-12): 직접 움직이기(HIGH) 중에는 받지 않는다. Agent 낙상 규칙이 기다렸다가
# 다시 신청하고, 막힌 시간이 1분이면 보호자에게 긴급 알림을 보낸다.
execution:
  mode: FOREGROUND
  priority: NORMAL
  resources: [BASE, SPEAKER]
