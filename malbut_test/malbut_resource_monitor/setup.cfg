[develop]
script_dir=$base/lib/malbut_resource_monitor
[install]
install_scripts=$base/lib/malbut_resource_monitor
[tool:pytest]
testpaths=test
# These are ordinary pytest tests, including direct rclpy integration tests.
# Humble's launch collector imports optional browser tests before pytest can skip them.
addopts = -p no:launch_testing -p no:launch_ros
