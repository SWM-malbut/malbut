services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: homecam
      POSTGRES_USER: homecam
      POSTGRES_PASSWORD: homecam_local_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecam -d homecam"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - homecam-postgres:/var/lib/postgresql/data

volumes:
  homecam-postgres:
