# This voice service uses libpulse for capture and ALSA only for output.
# An asym PCM without a capture slave must not probe the USB microphone.
pcm.pulse {
    type asym
    playback.pcm { type pulse }
}

# PortAudio19.6 enumerates default after other PCMs.
pcm.!default {
    type asym
    playback.pcm { type pulse }
}
