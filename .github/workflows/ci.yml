name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed modules
    runs-on: ubuntu-22.04
    outputs:
      web: ${{ steps.modules.outputs.web }}
      infra: ${{ steps.modules.outputs.infra }}
      ros: ${{ steps.modules.outputs.ros }}
      ros_full: ${{ steps.modules.outputs.ros_full }}
      homecam: ${{ steps.modules.outputs.homecam }}
      agent: ${{ steps.modules.outputs.agent }}
      assets: ${{ steps.modules.outputs.assets }}
      ros_packages: ${{ steps.modules.outputs.ros_packages }}
      ros_paths: ${{ steps.modules.outputs.ros_paths }}
      ros_test_packages: ${{ steps.modules.outputs.ros_test_packages }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test module selector
        run: .github/scripts/test-detect-ci-modules.sh

      - name: Select affected test groups
        id: modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            result="$(.github/scripts/detect-ci-modules.sh --all)"
          else
            result="$(.github/scripts/detect-ci-modules.sh "$BASE_SHA")"
          fi
          printf '%s\n' "$result"
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -n "$BASE_SHA" ]; then
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py')
          else
            mapfile -t files < <(git ls-files '*.py')
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files changed."
            exit 0
          fi
          python3 -m py_compile "${files[@]}"

  homecam-web:
    name: Homecam web lint and test
    runs-on: ubuntu-22.04
    needs: changes
    defaults:
      run:
        working-directory: homecam_web
    steps:
      - name: Skip unchanged Homecam web
        if: needs.changes.outputs.web != 'true'
        run: echo "No Homecam web files changed."
        working-directory: .

      - uses: actions/checkout@v6
        if: needs.changes.outputs.web == 'true'

      - name: Use Node.js 22
        if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: homecam_web/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.web == 'true'
        run: npm ci

      - name: Audit dependencies
        if: needs.changes.outputs.web == 'true'
        run: npm audit --audit-level=high

      - name: Validate Docker entrypoint
        if: needs.changes.outputs.web == 'true'
        run: sh -n docker-entrypoint.sh

      - name: Lint
        if: needs.changes.outputs.web == 'true'
        run: npm run lint

      - name: Build
        if: needs.changes.outputs.web == 'true'
        run: npm run build

      - name: Test
        if: needs.changes.outputs.web == 'true'
        run: npm test

  homecam-web-infra:
    name: Homecam web CDK build and test
    runs-on: ubuntu-22.04
    needs: changes
    defaults:
      run:
        working-directory: homecam_web/infra/cdk
    steps:
      - name: Skip unchanged Homecam infrastructure
        if: needs.changes.outputs.infra != 'true'
        run: echo "No Homecam infrastructure files changed."
        working-directory: .

      - uses: actions/checkout@v6
        if: needs.changes.outputs.infra == 'true'

      - name: Use Node.js 22
        if: needs.changes.outputs.infra == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            homecam_web/infra/cdk/package-lock.json
            homecam_web/infra/aws/kvs-broker/package-lock.json
            homecam_web/infra/aws/push-broker/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.infra == 'true'
        run: |
          npm ci
          npm --prefix ../aws/kvs-broker ci
          npm --prefix ../aws/push-broker ci

      - name: Build
        if: needs.changes.outputs.infra == 'true'
        run: npm run build

      - name: Test
        if: needs.changes.outputs.infra == 'true'
        run: npm test

      - name: Synthesize CloudFormation template
        if: needs.changes.outputs.infra == 'true'
        run: npm run synth -- -c authMigrationPhase=cleanup --no-lookups --quiet

  agent-python:
    name: Agent Python tests
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python test dependencies
        run: python -m pip install pytest PyYAML

      - name: Run Agent tests without ROS
        working-directory: malbut_agent_server
        env:
          PYTHONPATH: .
        run: python -m pytest -q -rs test

  test:
    name: Test
    runs-on: ubuntu-22.04
    needs: changes
    env:
      ROS_FULL: ${{ needs.changes.outputs.ros_full }}
      ROS_PACKAGES: ${{ needs.changes.outputs.ros_packages }}
      ROS_PATHS: ${{ needs.changes.outputs.ros_paths }}
      ROS_TEST_PACKAGES: ${{ needs.changes.outputs.ros_test_packages }}
      ROS_ASSETS: ${{ needs.changes.outputs.assets }}
    steps:
      - name: Skip unchanged ROS packages
        if: needs.changes.outputs.ros != 'true'
        run: echo "No ROS package files changed."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.ros == 'true'

      # ubuntu-22.04 runners ship an LLVM toolchain, and libunwind-15-dev
      # declares "Conflicts: libunwind-dev". That makes libgoogle-glog-dev
      # uninstallable, which in turn breaks libceres-dev, ros-humble-slam-toolbox
      # and ros-humble-nav2-bringup during rosdep install. Drop the versioned
      # LLVM copies so apt can resolve the plain libunwind-dev again.
      - name: Unblock libunwind-dev
        if: needs.changes.outputs.ros == 'true'
        shell: bash
        run: |
          echo "installed libunwind packages before:"
          dpkg -l | grep -E '^ii +libunwind' || echo "  (none)"
          mapfile -t blockers < <(dpkg -l | awk '/^ii +libunwind-[0-9]+-dev/{print $2}')
          if [ "${#blockers[@]}" -gt 0 ]; then
            echo "removing conflicting: ${blockers[*]}"
            sudo apt-get remove -y "${blockers[@]}"
          else
            echo "no versioned libunwind -dev package conflicts with libunwind-dev"
          fi
          echo "installed libunwind packages after:"
          dpkg -l | grep -E '^ii +libunwind' || echo "  (none)"
          # Informational: surface a still-blocked chain here instead of letting
          # it surface as an opaque rosdep failure hundreds of lines later.
          if apt-get install -s libgoogle-glog-dev >/dev/null 2>&1; then
            echo "libgoogle-glog-dev resolves; the ceres/slam_toolbox chain is clear"
          else
            echo "WARNING: libgoogle-glog-dev is still unresolvable" >&2
            apt-get install -s libgoogle-glog-dev 2>&1 | tail -20 >&2 || true
          fi

      - name: Install ROS and package dependencies
        if: needs.changes.outputs.ros == 'true'
        timeout-minutes: 20
        env:
          ROS_APT_SOURCE_VERSION: "1.2.0"
        run: |
          # ROS tests do not use Chrome. Its preinstalled apt source can fail
          # with a Hash Sum mismatch and prevent unrelated ROS installation.
          for apt_source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$apt_source" ] && grep -q 'dl.google.com/linux/chrome' "$apt_source"; then
              echo "Disabling unused Chrome apt source: $apt_source"
              sudo mv "$apt_source" "$apt_source.disabled"
            fi
          done
          # Keep the runner's mirror list and fallback endpoints. Pinning one
          # mirror makes all dependency downloads wait when it is unavailable.
          curl --fail --location --retry 3 \
            --connect-timeout 10 --max-time 60 \
            --output /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.jammy_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          # rosdep invokes apt itself, so apply download limits to those calls too.
          printf '%s\n' 'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | \
            sudo tee /etc/apt/apt.conf.d/99-malbut-ci >/dev/null
          ros_tools=()
          if [ "$ROS_FULL" = 'true' ]; then
            ros_tools=(ros-humble-xacro)
          fi
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-humble-ros-base \
            "${ros_tools[@]}"
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            sudo rosdep init
          fi
          rosdep update
          # ament_python is a colcon build type, not an installable ROS package.
          python3 -c 'import colcon_ros.task.ament_python.build'
          read -r -a package_paths <<< "$ROS_PATHS"
          rosdep install --from-paths "${package_paths[@]}" --ignore-src \
            --rosdistro humble \
            --skip-keys "ament_python python3-torchvision-pip python3-ultralytics-pip" \
            --dependency-types build --dependency-types buildtool \
            --dependency-types build_export --dependency-types exec \
            --dependency-types test -r -y

      - name: Build ROS packages
        if: needs.changes.outputs.ros == 'true'
        shell: bash
        run: |
          # Contract tests do not infer or download model runtimes. Upstream
          # skips its optional uv sync when uv is not on the build PATH.
          export PATH=/usr/bin:/bin
          source /opt/ros/humble/setup.bash
          read -r -a package_paths <<< "$ROS_PATHS"
          read -r -a packages <<< "$ROS_PACKAGES"
          colcon build --symlink-install --base-paths "${package_paths[@]}" \
            --packages-select "${packages[@]}"

      - name: Verify Agent ROS test dependencies
        if: needs.changes.outputs.agent == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 - <<'PY'
          from pathlib import Path
          import rclpy
          import yaml
          from ament_index_python.packages import get_package_prefix
          from malbut_interfaces.action import ExecuteMission, FollowPerson
          from malbut_interfaces.msg import SpeechTranscript
          from malbut_stt.pipeline import SpeechPipeline
          from malbut_system_manager.system_manager_node import SystemManagerNode
          from malbut_tts import receiver

          prefix = get_package_prefix('malbut_agent_server')
          assert (Path(prefix) / 'lib/malbut_agent_server/speech_receiver').is_file()
          PY


      - name: Run changed ROS package tests
        if: needs.changes.outputs.ros == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          read -r -a package_paths <<< "$ROS_PATHS"
          read -r -a test_packages <<< "$ROS_TEST_PACKAGES"
          # Expensive triangle-by-route checks are needed only for changed
          # scene/actor assets (or explicit full CI), not a web/launch edit.
          if [ "$ROS_ASSETS" != 'true' ]; then
            export PYTEST_ADDOPTS="--ignore=$GITHUB_WORKSPACE/malbut_gazebo/test/test_humanoid_route_collisions.py"
          fi
          if [ "${#test_packages[@]}" -gt 0 ]; then
            colcon test --event-handlers console_direct+ \
              --base-paths "${package_paths[@]}" --packages-select "${test_packages[@]}"
          fi
          colcon test-result --verbose

      - name: Run Agent ROS communication tests
        if: needs.changes.outputs.agent == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          cd malbut_agent_server
          # Core tests run in agent-python, without launch changing Python loggers.
          PYTHONPATH=".:${PYTHONPATH}" python3 -m pytest -q -rs \
            test/test_node_communication_ros.py test/test_ros_memory_communication.py \
            test/test_ros_weather_communication.py test/test_weather_action.py

      - name: Validate robot Xacro
        if: needs.changes.outputs.ros_full == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          xacro install/malbut_gazebo/share/malbut_gazebo/urdf/robot.gazebo.xacro > /tmp/malbut.urdf
          test -s /tmp/malbut.urdf

      - name: Validate navigation launch
        if: needs.changes.outputs.ros_full == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 launch malbut_gazebo navigation.launch.py --show-args

  homecam:
    name: Homecam build and test
    runs-on: ubuntu-22.04
    needs: changes
    timeout-minutes: 60
    steps:
      - name: Skip unchanged Homecam agent
        if: needs.changes.outputs.homecam != 'true'
        run: echo "No Homecam agent files changed."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.homecam == 'true'
        with:
          path: src/malbut

      - name: Cache pinned KVS WebRTC SDK
        if: needs.changes.outputs.homecam == 'true'
        uses: actions/cache@v4
        with:
          path: .deps/amazon-kinesis-video-streams-webrtc-sdk-c-v1.19.1
          key: kvs-webrtc-${{ runner.os }}-${{ hashFiles('src/malbut/homecam_agent/scripts/build_kvs_webrtc_sdk.sh') }}

      - name: Unblock libunwind-dev
        if: needs.changes.outputs.homecam == 'true'
        shell: bash
        run: |
          echo "installed libunwind packages before:"
          dpkg -l | grep -E '^ii +libunwind' || echo "  (none)"
          mapfile -t blockers < <(dpkg -l | awk '/^ii +libunwind-[0-9]+-dev/{print $2}')
          if [ "${#blockers[@]}" -gt 0 ]; then
            echo "removing conflicting: ${blockers[*]}"
            sudo apt-get remove -y "${blockers[@]}"
          else
            echo "no versioned libunwind -dev package conflicts with libunwind-dev"
          fi
          echo "installed libunwind packages after:"
          dpkg -l | grep -E '^ii +libunwind' || echo "  (none)"

      - name: Configure ROS apt source
        if: needs.changes.outputs.homecam == 'true'
        timeout-minutes: 10
        env:
          ROS_APT_SOURCE_VERSION: "1.2.0"
        run: |
          # This ROS build does not use Chrome or its package repository.
          for apt_source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$apt_source" ] && grep -q 'dl.google.com/linux/chrome' "$apt_source"; then
              echo "Disabling unused Chrome apt source: $apt_source"
              sudo mv "$apt_source" "$apt_source.disabled"
            fi
          done
          # Preserve the runner's mirror list and fallback endpoints.
          curl --fail --location --retry 3 \
            --connect-timeout 10 --max-time 60 \
            --output /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.jammy_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          # Apply the same limits to apt calls made later by rosdep.
          printf '%s\n' 'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | \
            sudo tee /etc/apt/apt.conf.d/99-malbut-ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-humble-ros-base \
            ros-humble-xacro
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            sudo rosdep init
          fi
          rosdep update

      - name: Install Malbut dependencies
        if: needs.changes.outputs.homecam == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          # ament_python is provided by colcon's build plugin.
          python3 -c 'import colcon_ros.task.ament_python.build'
          rosdep install \
            --from-paths src \
              src/malbut/malbut_yolo/vendor/yolo_ros/yolo_ros \
              src/malbut/malbut_yolo/vendor/yolo_ros/yolo_msgs \
            --ignore-src \
            --skip-keys "ament_python python3-torchvision-pip python3-ultralytics-pip" \
            --rosdistro humble \
            --dependency-types build \
            --dependency-types buildtool \
            --dependency-types build_export \
            --dependency-types exec \
            --dependency-types test \
            -r -y

      - name: Build and test homecam
        if: needs.changes.outputs.homecam == 'true'
        shell: bash
        working-directory: src/malbut
        run: |
          # Do not let yolo_ros's optional uv build hook install GPU runtimes.
          export PATH=/usr/bin:/bin
          ./homecam_agent/scripts/setup_portable_sim.sh \
            --workspace "$GITHUB_WORKSPACE"
