name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [ -n "$BASE_SHA" ]; then
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py')
          else
            mapfile -t files < <(git ls-files '*.py')
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files changed."
            exit 0
          fi
          python3 -m py_compile "${files[@]}"

  homecam-web:
    name: Homecam web lint and test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: homecam_web
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: homecam_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate Docker entrypoint
        run: sh -n docker-entrypoint.sh

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

  homecam-web-infra:
    name: Homecam web CDK build and test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: homecam_web/infra/cdk
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: homecam_web/infra/cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Synthesize CloudFormation template
        run: npm run synth -- --no-lookups --quiet

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # ubuntu-22.04 runners ship an LLVM toolchain, and libunwind-15-dev
      # declares "Conflicts: libunwind-dev". That makes libgoogle-glog-dev
      # uninstallable, which in turn breaks libceres-dev, ros-humble-slam-toolbox
      # and ros-humble-nav2-bringup during rosdep install. Drop the versioned
      # LLVM copies so apt can resolve the plain libunwind-dev again.
      - name: Unblock libunwind-dev
        shell: bash
        run: |
          echo "installed libunwind packages before:"
          dpkg -l | grep -E '^ii +libunwind' || echo "  (none)"
          mapfile -t blockers < <(dpkg -l | awk '/^ii +libunwind-[0-9]+-dev/{print $2}')
          if [ "${#blockers[@]}" -gt 0 ]; then
            echo "removing conflicting: ${blockers[*]}"
            sudo apt-get remove -y "${blockers[@]}"
          else
            echo "no versioned libunwind -dev package conflicts with libunwind-dev"
          fi
          echo "installed libunwind packages after:"
          dpkg -l | grep -E '^ii +libunwind' || echo "  (none)"
          # Informational: surface a still-blocked chain here instead of letting
          # it surface as an opaque rosdep failure hundreds of lines later.
          if apt-get install -s libgoogle-glog-dev >/dev/null 2>&1; then
            echo "libgoogle-glog-dev resolves; the ceres/slam_toolbox chain is clear"
          else
            echo "WARNING: libgoogle-glog-dev is still unresolvable" >&2
            apt-get install -s libgoogle-glog-dev 2>&1 | tail -20 >&2 || true
          fi

      - name: Install ROS and package dependencies
        env:
          ROS_APT_SOURCE_VERSION: "1.2.0"
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.jammy_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-humble-ros-base \
            ros-humble-xacro
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            sudo rosdep init
          fi
          rosdep update
          rosdep install --from-paths . --ignore-src --rosdistro humble \
            --dependency-types build \
            --dependency-types buildtool \
            --dependency-types build_export \
            --dependency-types exec \
            --dependency-types test \
            -r -y
          rosdep install --from-paths malbut_patrol --ignore-src \
            --rosdistro humble \
            --dependency-types test \
            -r -y

      - name: Build ROS packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install \
            --packages-select \
              malbut_description \
              malbut_gazebo \
              malbut_roaming \
              malbut_patrol \
              malbut_agent_server \
              malbut_perception

      - name: Test patrol package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --packages-select malbut_patrol
          colcon test-result --verbose

      - name: Run ROS package tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ \
            --packages-select \
              malbut_description \
              malbut_gazebo \
              malbut_roaming \
              malbut_agent_server \
              malbut_perception
          colcon test-result --verbose

      - name: Validate robot Xacro
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          xacro install/malbut_gazebo/share/malbut_gazebo/urdf/robot.gazebo.xacro > /tmp/malbut.urdf
          test -s /tmp/malbut.urdf

      - name: Validate navigation launch
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 launch malbut_gazebo navigation.launch.py --show-args

  homecam:
    name: Homecam build and test
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/malbut

      - name: Cache pinned KVS WebRTC SDK
        uses: actions/cache@v4
        with:
          path: .deps/amazon-kinesis-video-streams-webrtc-sdk-c-v1.19.1
          key: kvs-webrtc-${{ runner.os }}-${{ hashFiles('src/malbut/homecam_agent/scripts/build_kvs_webrtc_sdk.sh') }}

      - name: Unblock libunwind-dev
        shell: bash
        run: |
          echo "installed libunwind packages before:"
          dpkg -l | grep -E '^ii +libunwind' || echo "  (none)"
          mapfile -t blockers < <(dpkg -l | awk '/^ii +libunwind-[0-9]+-dev/{print $2}')
          if [ "${#blockers[@]}" -gt 0 ]; then
            echo "removing conflicting: ${blockers[*]}"
            sudo apt-get remove -y "${blockers[@]}"
          else
            echo "no versioned libunwind -dev package conflicts with libunwind-dev"
          fi
          echo "installed libunwind packages after:"
          dpkg -l | grep -E '^ii +libunwind' || echo "  (none)"

      - name: Configure ROS apt source
        env:
          ROS_APT_SOURCE_VERSION: "1.2.0"
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.jammy_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-humble-ros-base \
            ros-humble-xacro
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            sudo rosdep init
          fi
          rosdep update

      - name: Install Malbut dependencies
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          rosdep install \
            --from-paths src/malbut/malbut_description src/malbut/malbut_gazebo \
            --ignore-src \
            --rosdistro humble \
            --dependency-types build \
            --dependency-types buildtool \
            --dependency-types build_export \
            --dependency-types exec \
            --dependency-types test \
            -r -y

      - name: Build and test homecam
        shell: bash
        working-directory: src/malbut
        run: |
          ./homecam_agent/scripts/setup_portable_sim.sh \
            --workspace "$GITHUB_WORKSPACE"
