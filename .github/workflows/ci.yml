name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [ -n "$BASE_SHA" ]; then
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py')
          else
            mapfile -t files < <(git ls-files '*.py')
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files changed."
            exit 0
          fi
          python3 -m py_compile "${files[@]}"

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install package dependencies
        run: |
          sudo apt-get update
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            sudo rosdep init
          fi
          rosdep update
          rosdep install --from-paths . --ignore-src --rosdistro humble \
            --dependency-types build,buildtool,build_export -r -y
          sudo apt-get install -y ros-humble-xacro

      - name: Build ROS packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --packages-select malbut_description malbut_gazebo

      - name: Validate robot Xacro
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          xacro install/malbut_gazebo/share/malbut_gazebo/urdf/robot.gazebo.xacro > /tmp/malbut.urdf
          test -s /tmp/malbut.urdf
