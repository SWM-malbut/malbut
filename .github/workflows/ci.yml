name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed modules
    runs-on: ubuntu-22.04
    outputs:
      web: ${{ steps.modules.outputs.web }}
      infra: ${{ steps.modules.outputs.infra }}
      ros: ${{ steps.modules.outputs.ros }}
      homecam: ${{ steps.modules.outputs.homecam }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test module selector
        run: .github/scripts/test-detect-ci-modules.sh

      - name: Select affected test groups
        id: modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          result="$(.github/scripts/detect-ci-modules.sh "$BASE_SHA")"
          printf '%s\n' "$result"
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [ -n "$BASE_SHA" ]; then
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py')
          else
            mapfile -t files < <(git ls-files '*.py')
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files changed."
            exit 0
          fi
          python3 -m py_compile "${files[@]}"

  homecam-web:
    name: Homecam web lint and test
    runs-on: ubuntu-22.04
    needs: changes
    defaults:
      run:
        working-directory: homecam_web
    steps:
      - name: Skip unchanged Homecam web
        if: needs.changes.outputs.web != 'true'
        run: echo "No Homecam web files changed."
        working-directory: .

      - uses: actions/checkout@v6
        if: needs.changes.outputs.web == 'true'

      - name: Use Node.js 22
        if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: homecam_web/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.web == 'true'
        run: npm ci

      - name: Audit dependencies
        if: needs.changes.outputs.web == 'true'
        run: npm audit --audit-level=high

      - name: Validate Docker entrypoint
        if: needs.changes.outputs.web == 'true'
        run: sh -n docker-entrypoint.sh

      - name: Lint
        if: needs.changes.outputs.web == 'true'
        run: npm run lint

      - name: Build and test
        if: needs.changes.outputs.web == 'true'
        run: npm test

  homecam-web-infra:
    name: Homecam web CDK build and test
    runs-on: ubuntu-22.04
    needs: changes
    defaults:
      run:
        working-directory: homecam_web/infra/cdk
    steps:
      - name: Skip unchanged Homecam infrastructure
        if: needs.changes.outputs.infra != 'true'
        run: echo "No Homecam infrastructure files changed."
        working-directory: .

      - uses: actions/checkout@v6
        if: needs.changes.outputs.infra == 'true'

      - name: Use Node.js 22
        if: needs.changes.outputs.infra == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            homecam_web/infra/cdk/package-lock.json
            homecam_web/infra/aws/kvs-broker/package-lock.json
            homecam_web/infra/aws/push-broker/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.infra == 'true'
        run: |
          npm ci
          npm --prefix ../aws/kvs-broker ci
          npm --prefix ../aws/push-broker ci

      - name: Build
        if: needs.changes.outputs.infra == 'true'
        run: npm run build

      - name: Test
        if: needs.changes.outputs.infra == 'true'
        run: npm test

      - name: Synthesize CloudFormation template
        if: needs.changes.outputs.infra == 'true'
        run: npm run synth -- -c authMigrationPhase=cleanup --no-lookups --quiet

  test:
    name: Test
    runs-on: ubuntu-22.04
    needs: changes
    steps:
      - name: Skip unchanged ROS packages
        if: needs.changes.outputs.ros != 'true'
        run: echo "No ROS package files changed."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.ros == 'true'

      # ubuntu-22.04 runners ship an LLVM toolchain, and libunwind-15-dev
      # declares "Conflicts: libunwind-dev". That makes libgoogle-glog-dev
      # uninstallable, which in turn breaks libceres-dev, ros-humble-slam-toolbox
      # and ros-humble-nav2-bringup during rosdep install. Drop the versioned
      # LLVM copies so apt can resolve the plain libunwind-dev again.
      - name: Unblock libunwind-dev
        if: needs.changes.outputs.ros == 'true'
        shell: bash
        run: |
          echo "installed libunwind packages before:"
          dpkg -l | grep -E '^ii +libunwind' || echo "  (none)"
          mapfile -t blockers < <(dpkg -l | awk '/^ii +libunwind-[0-9]+-dev/{print $2}')
          if [ "${#blockers[@]}" -gt 0 ]; then
            echo "removing conflicting: ${blockers[*]}"
            sudo apt-get remove -y "${blockers[@]}"
          else
            echo "no versioned libunwind -dev package conflicts with libunwind-dev"
          fi
          echo "installed libunwind packages after:"
          dpkg -l | grep -E '^ii +libunwind' || echo "  (none)"
          # Informational: surface a still-blocked chain here instead of letting
          # it surface as an opaque rosdep failure hundreds of lines later.
          if apt-get install -s libgoogle-glog-dev >/dev/null 2>&1; then
            echo "libgoogle-glog-dev resolves; the ceres/slam_toolbox chain is clear"
          else
            echo "WARNING: libgoogle-glog-dev is still unresolvable" >&2
            apt-get install -s libgoogle-glog-dev 2>&1 | tail -20 >&2 || true
          fi

      - name: Install ROS and package dependencies
        if: needs.changes.outputs.ros == 'true'
        timeout-minutes: 20
        env:
          ROS_APT_SOURCE_VERSION: "1.2.0"
        run: |
          # GitHub-hosted Ubuntu runners prefer the Azure mirror. When that
          # endpoint is unhealthy apt can wait for each package indefinitely,
          # even though archive.ubuntu.com is listed as a fallback.
          if [ -f /etc/apt/apt-mirrors.txt ] && \
             grep -q 'azure.archive.ubuntu.com' /etc/apt/apt-mirrors.txt; then
            echo 'https://archive.ubuntu.com/ubuntu' | \
              sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          curl --fail --location --retry 3 \
            --connect-timeout 10 --max-time 60 \
            --output /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.jammy_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-humble-ros-base \
            ros-humble-xacro
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            sudo rosdep init
          fi
          rosdep update
          rosdep install --from-paths . --ignore-src --rosdistro humble \
            --dependency-types build \
            --dependency-types buildtool \
            --dependency-types build_export \
            --dependency-types exec \
            --dependency-types test \
            -r -y
          rosdep install --from-paths malbut_autonomy/malbut_patrol --ignore-src \
            --rosdistro humble \
            --dependency-types test \
            -r -y

      - name: Build ROS packages
        if: needs.changes.outputs.ros == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install \
            --packages-select \
              malbut_description \
              malbut_gazebo \
              malbut_interfaces \
              malbut_lidar_preprocessor \
              malbut_roaming \
              malbut_patrol \
              malbut_agent_server \
              malbut_perception \
              malbut_tracking

      - name: Test patrol package
        if: needs.changes.outputs.ros == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --packages-select malbut_patrol
          colcon test-result --verbose

      - name: Run ROS package tests
        if: needs.changes.outputs.ros == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ \
            --packages-select \
              malbut_description \
              malbut_gazebo \
              malbut_lidar_preprocessor \
              malbut_roaming \
              malbut_agent_server \
              malbut_perception \
              malbut_tracking
          colcon test-result --verbose

      - name: Validate robot Xacro
        if: needs.changes.outputs.ros == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          xacro install/malbut_gazebo/share/malbut_gazebo/urdf/robot.gazebo.xacro > /tmp/malbut.urdf
          test -s /tmp/malbut.urdf

      - name: Validate navigation launch
        if: needs.changes.outputs.ros == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 launch malbut_gazebo navigation.launch.py --show-args

  homecam:
    name: Homecam build and test
    runs-on: ubuntu-22.04
    needs: changes
    timeout-minutes: 60
    steps:
      - name: Skip unchanged Homecam agent
        if: needs.changes.outputs.homecam != 'true'
        run: echo "No Homecam agent files changed."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.homecam == 'true'
        with:
          path: src/malbut

      - name: Cache pinned KVS WebRTC SDK
        if: needs.changes.outputs.homecam == 'true'
        uses: actions/cache@v4
        with:
          path: .deps/amazon-kinesis-video-streams-webrtc-sdk-c-v1.19.1
          key: kvs-webrtc-${{ runner.os }}-${{ hashFiles('src/malbut/homecam_agent/scripts/build_kvs_webrtc_sdk.sh') }}

      - name: Unblock libunwind-dev
        if: needs.changes.outputs.homecam == 'true'
        shell: bash
        run: |
          echo "installed libunwind packages before:"
          dpkg -l | grep -E '^ii +libunwind' || echo "  (none)"
          mapfile -t blockers < <(dpkg -l | awk '/^ii +libunwind-[0-9]+-dev/{print $2}')
          if [ "${#blockers[@]}" -gt 0 ]; then
            echo "removing conflicting: ${blockers[*]}"
            sudo apt-get remove -y "${blockers[@]}"
          else
            echo "no versioned libunwind -dev package conflicts with libunwind-dev"
          fi
          echo "installed libunwind packages after:"
          dpkg -l | grep -E '^ii +libunwind' || echo "  (none)"

      - name: Configure ROS apt source
        if: needs.changes.outputs.homecam == 'true'
        timeout-minutes: 10
        env:
          ROS_APT_SOURCE_VERSION: "1.2.0"
        run: |
          # Keep apt off the intermittently unresponsive Azure mirror used by
          # GitHub-hosted Ubuntu runners. The official mirror serves the same
          # Jammy repositories and fails promptly with the limits below.
          if [ -f /etc/apt/apt-mirrors.txt ] && \
             grep -q 'azure.archive.ubuntu.com' /etc/apt/apt-mirrors.txt; then
            echo 'https://archive.ubuntu.com/ubuntu' | \
              sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          curl --fail --location --retry 3 \
            --connect-timeout 10 --max-time 60 \
            --output /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.jammy_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-humble-ros-base \
            ros-humble-xacro
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            sudo rosdep init
          fi
          rosdep update

      - name: Install Malbut dependencies
        if: needs.changes.outputs.homecam == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          rosdep install \
            --from-paths src/malbut/malbut_description src/malbut/malbut_gazebo \
            --ignore-src \
            --rosdistro humble \
            --dependency-types build \
            --dependency-types buildtool \
            --dependency-types build_export \
            --dependency-types exec \
            --dependency-types test \
            -r -y

      - name: Build and test homecam
        if: needs.changes.outputs.homecam == 'true'
        shell: bash
        working-directory: src/malbut
        run: |
          ./homecam_agent/scripts/setup_portable_sim.sh \
            --workspace "$GITHUB_WORKSPACE"
