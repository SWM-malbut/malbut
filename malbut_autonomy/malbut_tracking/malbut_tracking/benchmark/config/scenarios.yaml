    map_file:
      package: malbut_gazebo
      path: maps/small_house.yaml
    actor_file:
      package: malbut_tracking
      path: benchmark/actors/small_house_living_room.sdf
    trajectory: living_room_large_loop
    robot_pose: {x: -1.5, y: 1.2, z: 0.002, yaw: -1.5707963267948966}
    actor_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

