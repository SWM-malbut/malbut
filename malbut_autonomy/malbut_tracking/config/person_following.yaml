person_follower:
  ros__parameters:
    # Physical robots use wall time. The Gazebo demo overrides this to true.
    use_sim_time: false

    action_name: follow_person
    detections_topic: /perception/person/detections_3d
    global_costmap_topic: /global_costmap/costmap_raw
    static_map_topic: /map
    # 래치된 지도가 늦게 붙은 구독자에게 오지 않으면 여기로 직접 물어본다.
    static_map_service: /map_server/map
    scan_topic: /scan
    status_topic: /tracking/person/status
    target_pose_topic: /tracking/person/estimated_target_pose
    track_markers_topic: /tracking/person/lidar_tracks

    # Standard Nav2 endpoints. The follower never publishes /cmd_vel.
    follow_path_action: follow_path
    compute_path_action: compute_path_to_pose
    planner_id: GridBased
    tracking_controller_id: FollowPath
    goal_checker_id: general_goal_checker
    spin_action: spin
    navigation_retry_delay_s: 0.75
    speed_limit_topic: speed_limit
    global_frame: map
    odometry_frame: odom
    robot_frame: base_footprint

    minimum_confidence: 0.20
    # RGB-D supplies the authoritative visible-person position and is never
    # rejected by a stale-position distance gate. The 1.5 m continuity gate
    # applies only after camera loss when LiDAR continues the labeled track.
    lidar_continuation_max_distance_m: 1.50
    camera_position_alpha: 0.55
    camera_velocity_alpha: 0.35
    maximum_person_speed_mps: 2.0
    # Map-subtracted scan points are only foreground candidates. Requiring a
    # compact multi-ray cluster prevents one jittering wall return from being
    # promoted to an object while preserving nearby human legs.
    cluster_gap_m: 0.20
    minimum_cluster_points: 3
    minimum_cluster_density_points_per_m: 5.0
    maximum_cluster_points: 120
    maximum_cluster_extent_m: 0.80
    static_occupied_threshold: 65
    # The static map is distance-transformed once. Each scan endpoint then
    # performs one cached lookup to suppress walls, furniture, and map error.
    # Camera tracking remains authoritative when a person is near furniture.
    static_exclusion_radius_m: 0.20

    # Constant-velocity Kalman filter and global nearest-neighbor assignment.
    # 9.21 is the 99 percent chi-square gate for a 2-D measurement.
    tracker_process_variance: 1.0
    tracker_measurement_variance: 0.04
    mahalanobis_gate: 9.21
    track_confirmation_hits: 3
    maximum_missed_updates: 4
    maximum_coast_time_s: 3.0
    # RGB-D is authoritative while visible. A LiDAR obstacle receives its
    # label only when its centroid is tightly consistent with that map point.
    camera_label_gate_m: 0.40
    # Only clusters near the camera-confirmed person (or its short prediction)
    # enter the tracker. This follower is not a general scene-wide DATMO node.
    lidar_candidate_gate_m: 0.70
    # While metric RGB-D is fresh, it narrows the wider prediction gate. A
    # small bounded extent allowance covers the torso/leg centroid offset;
    # neighboring furniture is negative evidence and loses the person label.
    camera_lidar_fusion_freshness_s: 0.40
    camera_lidar_extent_padding_m: 0.15
    # A large one-frame RGB-D jump cannot replace the current person by
    # itself. Normal continuous motion or a confirmed LiDAR track is accepted
    # immediately; otherwise the new region must repeat on two camera frames.
    camera_jump_base_gate_m: 0.75
    camera_jump_confirmation_hits: 2
    camera_jump_pending_consistency_m: 0.50
    # Keep a current LiDAR label through small centroid noise, but let a
    # clearly closer RGB-D match correct an obstacle-label mix-up.
    camera_rebind_margin_m: 0.15
    # After RGB-D labels a confirmed obstacle, current LiDAR measurements may
    # continue that same track briefly after camera loss. While RGB-D remains
    # current, LiDAR may only make fast near-range ALIGN/RETREAT decisions;
    # camera observations continue to own forward tracking.
    lidar_continuation_timeout_s: 3.0
    # After camera loss, grow the 0.70 m local gate only as far as a person
    # could move. If the camera is looking at the stale point and sees nobody,
    # exactly one confirmed nearby moving track may inherit the person label.
    lidar_reassociation_max_distance_m: 1.50
    dynamic_rebind_minimum_speed_mps: 0.10
    camera_negative_evidence_frames: 2
    camera_horizontal_fov_rad: 1.291543646
    lidar_proximity_control_distance_m: 1.50
    lidar_proximity_camera_guard_s: 0.30
    # Nominal one-metre standoff. The robot holds in the 0.90--1.10 m band.
    desired_distance_m: 1.00
    minimum_distance_m: 0.65
    distance_tolerance_m: 0.10
    # Once translation is unnecessary, rotate only enough to center the
    # fixed forward camera. Translation and rotation are never commanded by
    # separate controllers at the same time.
    alignment_angle_tolerance_rad: 0.10
    # Hiwonder's physical ROSOrin course demonstrates 0.30 m/s chassis
    # motion. Translation, including reverse, remains collision checked by
    # Nav2 ComputePathToPose and the configured holonomic controller.
    maximum_linear_speed_mps: 0.30
    retreat_maximum_travel_m: 0.12
    # Start backing away before an approaching person crosses the lower
    # distance bound, then refresh the short collision-checked retreat path.
    approach_prediction_horizon_s: 0.75
    approach_speed_threshold_mps: 0.10
    retreat_goal_update_distance_m: 0.04
    retreat_goal_update_period_s: 0.15

    # Nav2 plans toward the observed person or its nearest admissible costmap
    # cell. These existing per-update lookaheads bound that global path.
    goal_update_distance_m: 0.25
    goal_update_period_s: 0.75
    precise_maximum_travel_m: 0.50
    # Camera-only targets outside the costmap remain followable through
    # longer coarse segments. Large changes preempt immediately and the
    # period forces refresh even while displacement remains small.
    coarse_goal_update_distance_m: 0.50
    coarse_goal_update_period_s: 0.75
    coarse_maximum_travel_m: 0.80
    # Past the 3 m depth limit, RGB supplies direction and a minimum range.
    # Repeated 1.2 m segments close that distance until metric depth returns.
    bearing_goal_update_distance_m: 0.20
    bearing_goal_update_period_s: 0.50
    bearing_only_variance_threshold_m2: 1.0
    bearing_maximum_travel_m: 1.20

    # Accept destinations only beyond the global inflation gradient. With the
    # current Nav2 inflation radius this preserves roughly the configured
    # 0.55 m wall margin, while the search chooses the room side of a corner.
    goal_maximum_cost: 80
    goal_safe_search_radius_m: 1.00
    goal_openness_radius_m: 0.60
    goal_openness_preference_m: 0.30
    heading_probe_distance_m: 0.90
    minimum_heading_clearance_m: 0.45
    require_global_costmap_for_goal: true

    # RGB-D establishes identity. A confirmed, still-observed LiDAR track may
    # keep the target alive for the bounded continuation window above. When
    # both sensors lose it, freeze and finish the current waypoint, turn once
    # toward the predicted exit direction, then travel to the last safe point.
    # At the nominal 3 Hz perception contract this requires more than one
    # missed frame, avoiding recovery churn from a single delayed inference.
    # This timeout transitions to stationary TARGET_LOST; it does not finish
    # the long-running FollowPerson action. Explicit client cancellation is
    # the only normal way to end that action.
    temporary_lost_timeout_s: 0.75
    target_lost_timeout_s: 8.0
    # The camera's 74-degree horizontal field of view has a roughly
    # 37-degree half-angle. Turn at least 40 degrees toward the exit side so
    # a stale map estimate cannot reduce reacquisition to a tiny correction.
    recovery_direction_minimum_turn_rad: 0.70
    # FollowPath can struggle over the final centimeters while rotating.
    # This tolerance applies only to the frozen loss-recovery waypoint.
    recovery_waypoint_tolerance_m: 0.08
    # Search 270 degrees in the sign of the last observed camera bearing,
    # rather than always rotating counter-clockwise through a full circle.
    recovery_scan_angle_rad: 4.71238898
    # 지도를 만든 뒤 들어온 정적 물체는 저장된 지도에 없어 계속 전경으로
    # 남는다. 한자리를 이만큼 지키면 배경으로 보고 후보에서 뺀다. 확인된
    # 사람에게는 적용하지 않으므로 가만히 서 있어도 놓치지 않는다.
    background_settle_seconds: 8.0
    background_settle_radius_m: 0.25
    # 치워진 물체의 자리는 다시 열어 둔다. 그러지 않으면 그 자리를 지나는
    # 사람까지 계속 무시하게 된다.
    background_forget_seconds: 20.0
    # 카메라는 자기 화각만 보고 라이다는 모든 방위를 본다. 아직 사람을
    # 확인하지 못한 동안, 화각 밖 라이다 후보 쪽으로 한 번 돌아본다.
    # 사람인지 아닌지는 여전히 카메라가 판단한다.
    lidar_acquisition_enabled: true
    lidar_acquisition_interval_s: 3.0
    lidar_acquisition_max_distance_m: 6.0
    lidar_acquisition_spin_allowance_s: 12.0
    recovery_spin_allowance_s: 12.0

    # Bounded prediction supports identity association and display only.
    prediction_horizon_s: 0.60
    transform_timeout_s: 0.10
    # Sensor callbacks never block perception waiting for TF. The newest scan
    # is queued briefly and processed only when its exact transform arrives.
    sensor_transform_queue_timeout_s: 0.30
    # TF 가 스캔보다 뒤처지면 정확 시각 변환이 존재하지 않아 모든 스캔이
    # 버려지고 LiDAR 추적이 통째로 멈춘다. 이 값보다 지연이 작으면 최신
    # 변환으로 대체한다. 자기 운동 보정을 포기하는 절충이므로 기본은 0 이다.
    scan_transform_max_tf_lag_s: 0.0
