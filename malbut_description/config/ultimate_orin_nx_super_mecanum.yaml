notes:
  - "Visual and static collision geometry comes from Hiwonder's official simulations.zip without geometric remodeling."
  - "Wheel radius, width, wheelbase, offsets, and sensor mounts are derived from the supplied Hiwonder Xacro and meshes and remain provisional until checked on the delivered robot."
  - "Dynamic wheels use one continuous joint per official wheel mesh and a spherical Fortress contact proxy; the official package's duplicate 10 kg cylinder wheels are intentionally not used."
  - "The D500 publishes 5000 measurements/s and normally runs at 10 Hz, so 500 samples per scan is a derived baseline."
  - "The D500 maximum range uses the conservative black-target value (8 m), not the white-target value (12 m)."
  - "Sensor mounting transforms, component mass split, friction, and controller limits are intentionally exposed for later hardware tuning."
